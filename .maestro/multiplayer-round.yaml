appId: host.exp.Exponent
name: Multiplayer Round Progression
tags:
  - e2e
  - multiplayer
---
# Clean up any leftover test data
- runScript: scripts/cleanup.js

- launchApp
- tapOn: what-of-the-year

# Home → Setup → Lobby
- tapOn: "Start"
- waitForAnimationToEnd

- tapOn: "User name"
- inputText: "Host Player"

- tapOn: "Start"
- waitForAnimationToEnd

# Extract sessionId
- copyTextFrom:
    id: session-id
- evalScript: ${output.sessionId = maestro.copiedText}

# Add a simulated player
- evalScript: ${output.playerName = 'Bot Player'}
- evalScript: ${output.playerAvatar = '🤖'}
- runScript: scripts/add-player.js
- evalScript: ${output.botUid = output.lastPlayerUid}

- assertVisible: "Bot Player"
- assertVisible: "2 of 10"

# Start session — enters round 10
- tapOn: "Start"
- waitForAnimationToEnd
- assertVisible: "Round 10"

# Host makes a selection via autocomplete
- tapOn: "Enter your pick"
- inputText: "Test Pick"
- tapOn: "Enter"

# Simulated player also makes a selection for round 10
# This should trigger auto-advance to round 9
- evalScript: ${output.playerUid = output.botUid}
- evalScript: ${output.roundNumber = '10'}
- evalScript: ${output.pickName = 'Bot Pick'}
- runScript: scripts/make-selection.js

# Both players have selected — round should auto-advance to 9
- assertVisible: "Round 9"
