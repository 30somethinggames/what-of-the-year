appId: host.exp.Exponent
name: Multiplayer (Host)
tags:
  - e2e
  - multiplayer
---
# Clean up any leftover test data
- runScript: ../../scripts/cleanup.js

- launchApp
- tapOn: What of the Year

# Home → Setup → Lobby
- tapOn:
    id: home-start
- waitForAnimationToEnd

- tapOn:
    id: name-input
- inputText: "Host Player"

- tapOn:
    id: setup-submit
- waitForAnimationToEnd

# Lobby — verify host is alone
- assertVisible: "Host Player"
- assertVisible: "Host"
- assertVisible:
    id: player-count

# Extract sessionId
- copyTextFrom:
    id: session-id
- evalScript: ${output.sessionId = maestro.copiedText}

# Add Player 2
- evalScript: ${output.playerName = 'Player 2'}
- evalScript: ${output.playerAvatar = '🎮'}
- runScript: ../../scripts/add-player.js
- evalScript: ${output.player2Uid = output.lastPlayerUid}

- assertVisible: "Player 2"

# Add Player 3
- evalScript: ${output.playerName = 'Player 3'}
- evalScript: ${output.playerAvatar = '🎲'}
- runScript: ../../scripts/add-player.js
- evalScript: ${output.player3Uid = output.lastPlayerUid}

- assertVisible: "Player 3"

# Start session
- tapOn:
    id: lobby-start
- waitForAnimationToEnd

# Round 10 — host selects from autocomplete, other players pick via API
- assertVisible: "Round 10"
- tapOn:
    id: pick-input
- inputText: "a"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick

- evalScript: ${output.playerUid = output.player2Uid}
- evalScript: ${output.roundNumber = '10'}
- evalScript: ${output.pickName = 'Elden Ring'}
- runScript: ../../scripts/make-selection.js

- evalScript: ${output.playerUid = output.player3Uid}
- evalScript: ${output.pickName = 'Elden Ring'}
- runScript: ../../scripts/make-selection.js

# Round 9 — all pick, auto-advances
- assertVisible: "Round 9"
- tapOn:
    id: pick-input
- inputText: "b"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick

- evalScript: ${output.playerUid = output.player2Uid}
- evalScript: ${output.roundNumber = '9'}
- evalScript: ${output.pickName = 'Zelda'}
- runScript: ../../scripts/make-selection.js

- evalScript: ${output.playerUid = output.player3Uid}
- evalScript: ${output.pickName = 'Mario'}
- runScript: ../../scripts/make-selection.js

# Round 8 — Player 3 is unresponsive, host uses advance-round
- assertVisible: "Round 8"
- tapOn:
    id: pick-input
- inputText: "c"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick

- evalScript: ${output.playerUid = output.player2Uid}
- evalScript: ${output.roundNumber = '8'}
- evalScript: ${output.pickName = 'Hades'}
- runScript: ../../scripts/make-selection.js

# Player 3 never picks — host opens settings to advance
- tapOn:
    id: settings-button
- assertVisible:
    id: settings-title
- assertVisible: "Host Player"
- assertVisible:
    id: advance-round
- tapOn:
    id: advance-round

# Advance remaining rounds via settings (host tool for unresponsive users)
- assertVisible: "Round 7"
- tapOn:
    id: settings-button
- tapOn:
    id: advance-round

- assertVisible: "Round 6"
- tapOn:
    id: settings-button
- tapOn:
    id: advance-round

- assertVisible: "Round 5"
- tapOn:
    id: settings-button
- tapOn:
    id: advance-round

- assertVisible: "Round 4"
- tapOn:
    id: settings-button
- tapOn:
    id: advance-round

- assertVisible: "Round 3"
- tapOn:
    id: settings-button
- tapOn:
    id: advance-round

- assertVisible: "Round 2"
- tapOn:
    id: settings-button
- tapOn:
    id: advance-round

# Round 1 — End Game
- assertVisible: "Round 1"
- tapOn:
    id: settings-button
- assertVisible: "End Game"
- tapOn:
    id: advance-round

# Results Screen — verify picks and points
- assertVisible:
    id: results-list
- assertVisible: "Elden Ring"
- assertVisible: "Zelda"
- assertVisible: "Mario"
- assertVisible: "Hades"
