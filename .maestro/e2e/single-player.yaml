appId: host.exp.Exponent
name: Single Player
tags:
  - e2e
  - single-player
---
# Clean up any leftover test data
- runScript: ../scripts/cleanup.js

- launchApp
- tapOn: What of the Year

# Home → Setup → Lobby
- assertVisible: "Start"
- tapOn: "Start"
- waitForAnimationToEnd

- assertVisible: "Random"
- assertVisible: "User name"

- tapOn: "User name"
- inputText: "E2E Tester"

- tapOn: "Start"
- waitForAnimationToEnd

# Lobby — verify we landed as host
- assertVisible: "E2E Tester"
- assertVisible: "Host"
- assertVisible: "Invite"
- assertVisible: "Start"
- assertVisible: "1 of 10"

# Start the session
- tapOn: "Start"
- waitForAnimationToEnd

- assertVisible: "Round 10"

# Keyboard Avoidance — tap input, verify button stays visible
- tapOn: "Enter your pick"
- assertVisible: "Enter"
- inputText: "Original Pick"
- assertVisible: "Enter"

# Submit pick
- tapOn: "Enter"
- assertVisible: "Original Pick"

# Edit Selection — modify the pick
- tapOn: "Edit"
- assertVisible: "Save"

- tapOn: "Edit your pick"
- inputText: "Updated Pick"
- tapOn: "Save"

- assertVisible: "Updated Pick"
