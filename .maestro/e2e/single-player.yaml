appId: host.exp.Exponent
name: Single Player
tags:
  - e2e
  - single-player
---
# Clean up any leftover test data
- runScript: ../scripts/cleanup.js

- launchApp
- tapOn: What of the Year

# Home → Setup → Lobby
- assertVisible:
    id: home-start
- tapOn:
    id: home-start
- waitForAnimationToEnd

- assertVisible:
    id: random-avatar
- assertVisible:
    id: name-input

- tapOn:
    id: name-input
- inputText: "E2E Tester"

- tapOn:
    id: setup-submit
- waitForAnimationToEnd

# Lobby — verify we landed as host
- assertVisible: "E2E Tester"
- assertVisible: "Host"
- assertVisible:
    id: invite
- assertVisible:
    id: lobby-start
- assertVisible:
    id: player-count

# Start the session
- tapOn:
    id: lobby-start
- waitForAnimationToEnd

# Round 10 — select from autocomplete + submit
- assertVisible: "Round 10"
- tapOn:
    id: pick-input
- inputText: "a"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick

# Edit Selection — re-save the Round 10 pick
- tapOn: "Edit"
- assertVisible:
    id: cancel-edit
- tapOn:
    id: submit-pick

# Round 9
- assertVisible: "Round 9"
- tapOn:
    id: pick-input
- inputText: "c"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick

# Round 8
- assertVisible: "Round 8"
- tapOn:
    id: pick-input
- inputText: "d"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick

# Round 7
- assertVisible: "Round 7"
- tapOn:
    id: pick-input
- inputText: "e"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick

# Round 6
- assertVisible: "Round 6"
- tapOn:
    id: pick-input
- inputText: "f"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick

# Round 5
- assertVisible: "Round 5"
- tapOn:
    id: pick-input
- inputText: "g"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick

# Round 4
- assertVisible: "Round 4"
- tapOn:
    id: pick-input
- inputText: "h"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick

# Round 3
- assertVisible: "Round 3"
- tapOn:
    id: pick-input
- inputText: "m"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick

# Round 2
- assertVisible: "Round 2"
- tapOn:
    id: pick-input
- inputText: "p"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick

# Round 1 — last pick triggers navigation to results
- assertVisible: "Round 1"
- tapOn:
    id: pick-input
- inputText: "s"
- assertVisible:
    id: suggestion-item
- tapOn:
    id: suggestion-item
- tapOn:
    id: submit-pick
- waitForAnimationToEnd

# Results Screen
- assertVisible:
    id: results-list
- assertVisible: "E2E Tester"
- assertVisible: "10pts"
