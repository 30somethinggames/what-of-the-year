appId: host.exp.Exponent
name: Single Player
tags:
  - e2e
  - single-player
---
# Clean up any leftover test data
- runScript: ../scripts/cleanup.js

- launchApp
- tapOn: What of the Year

# Home → Setup → Lobby
- assertVisible:
    id: home-start
- tapOn:
    id: home-start
- waitForAnimationToEnd

- assertVisible:
    id: random-avatar
- assertVisible:
    id: name-input

- tapOn:
    id: name-input
- inputText: "E2E Tester"

- tapOn:
    id: setup-submit
- waitForAnimationToEnd

# Lobby — verify we landed as host
- assertVisible: "E2E Tester"
- assertVisible: "Host"
- assertVisible:
    id: invite
- assertVisible:
    id: lobby-start
- assertVisible:
    id: player-count

# Start the session
- tapOn:
    id: lobby-start
- waitForAnimationToEnd

# Round 10 — keyboard avoidance + submit
- assertVisible: "Round 10"
- tapOn:
    id: pick-input
- assertVisible:
    id: submit-pick
- inputText: "Pick Ten"
- assertVisible:
    id: submit-pick
- tapOn:
    id: submit-pick
- assertVisible: "Pick Ten"

# Edit Selection — modify the Round 10 pick
- tapOn: "Edit"
- tapOn:
    id: pick-input
- eraseText: 20
- inputText: "Updated Ten"
- tapOn:
    id: submit-pick
- assertVisible: "Updated Ten"

# Round 9 — auto-advanced after Round 10 pick
- assertVisible: "Round 9"
- tapOn:
    id: pick-input
- inputText: "Pick Nine"
- tapOn:
    id: submit-pick
- assertVisible: "Pick Nine"

# Round 8
- assertVisible: "Round 8"
- tapOn:
    id: pick-input
- inputText: "Pick Eight"
- tapOn:
    id: submit-pick

# Round 7
- assertVisible: "Round 7"
- tapOn:
    id: pick-input
- inputText: "Pick Seven"
- tapOn:
    id: submit-pick

# Round 6
- assertVisible: "Round 6"
- tapOn:
    id: pick-input
- inputText: "Pick Six"
- tapOn:
    id: submit-pick

# Round 5
- assertVisible: "Round 5"
- tapOn:
    id: pick-input
- inputText: "Pick Five"
- tapOn:
    id: submit-pick

# Round 4
- assertVisible: "Round 4"
- tapOn:
    id: pick-input
- inputText: "Pick Four"
- tapOn:
    id: submit-pick

# Round 3
- assertVisible: "Round 3"
- tapOn:
    id: pick-input
- inputText: "Pick Three"
- tapOn:
    id: submit-pick

# Round 2
- assertVisible: "Round 2"
- tapOn:
    id: pick-input
- inputText: "Pick Two"
- tapOn:
    id: submit-pick

# Round 1 — last pick triggers navigation to results
- assertVisible: "Round 1"
- tapOn:
    id: pick-input
- inputText: "Pick One"
- tapOn:
    id: submit-pick
- waitForAnimationToEnd

# Results Screen
- assertVisible:
    id: results-list
- assertVisible: "Updated Ten"
- assertVisible: "Pick Nine"
- assertVisible: "Pick One"
- assertVisible: "E2E Tester"
- assertVisible: "10pts"
