appId: host.exp.Exponent
name: Smoke Tests
tags:
  - smoke
---
- launchApp
- tapOn: What of the Year

# Home Screen — verify pickers and default state
- assertVisible:
    id: topic-picker
- assertVisible:
    id: year-picker
- assertVisible: "of"
- assertVisible:
    id: home-start
- takeScreenshot: .maestro/screenshots/home-screen

# Setup Screen
- tapOn:
    id: home-start
- waitForAnimationToEnd

- assertVisible:
    id: random-avatar
- assertVisible:
    id: name-input
- assertVisible:
    id: setup-submit
- assertVisible: "Game of 2026"
- takeScreenshot: .maestro/screenshots/setup-screen

# Round Screen — enter name and start
- tapOn:
    id: name-input
- inputText: "Test User"

- tapOn:
    id: setup-submit
- waitForAnimationToEnd

# Lobby Screen
- assertVisible:
    id: invite
- assertVisible:
    id: lobby-start

- tapOn:
    id: lobby-start
- waitForAnimationToEnd

- assertVisible:
    id: round-title
