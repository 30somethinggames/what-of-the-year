appId: host.exp.Exponent
name: Multiplayer Lobby
tags:
  - e2e
  - multiplayer
---
# Clean up any leftover test data
- runScript: scripts/cleanup.js

- launchApp
- tapOn: what-of-the-year

# Home → Setup
- tapOn: "Start"
- waitForAnimationToEnd

- tapOn: "User name"
- inputText: "Host Player"

- tapOn: "Start"
- waitForAnimationToEnd

# Lobby — verify host is alone
- assertVisible: "Host Player"
- assertVisible: "Host"
- assertVisible: "1 of 10"

# Extract sessionId from hidden element into output
- copyTextFrom:
    id: session-id
- evalScript: ${output.sessionId = maestro.copiedText}

# Add Player 2
- evalScript: ${output.playerName = 'Player 2'}
- evalScript: ${output.playerAvatar = '🎮'}
- runScript: scripts/add-player.js
- evalScript: ${output.player2Uid = output.lastPlayerUid}

- assertVisible: "Player 2"
- assertVisible: "2 of 10"

# Add Player 3
- evalScript: ${output.playerName = 'Player 3'}
- evalScript: ${output.playerAvatar = '🎲'}
- runScript: scripts/add-player.js

- assertVisible: "Player 3"
- assertVisible: "3 of 10"
