appId: host.exp.Exponent
name: Round Edit Selection
tags:
  - e2e
  - single-player
---
- runScript: scripts/cleanup.js

- launchApp
- tapOn: what-of-the-year

# Home → Setup → Lobby → Round
- tapOn: "Start"
- waitForAnimationToEnd

- tapOn: "User name"
- inputText: "Edit Tester"

- tapOn: "Start"
- waitForAnimationToEnd

# Start session from lobby (solo)
- tapOn: "Start"
- waitForAnimationToEnd

- assertVisible: "Round 10"

# Make a selection
- tapOn: "Enter your pick"
- inputText: "Original Pick"
- tapOn: "Enter"

# Verify pick appears
- assertVisible: "Original Pick"

# Edit the selection
- tapOn: "Edit"
- assertVisible: "Save"

- tapOn: "Edit your pick"
- inputText: "Updated Pick"
- tapOn: "Save"

# Verify updated pick
- assertVisible: "Updated Pick"
