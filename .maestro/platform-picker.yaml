appId: host.exp.Exponent
name: Platform Picker Behavior
tags:
  - e2e
  - platform
---
- launchApp
- tapOn: what-of-the-year

# Verify both pickers render
- assertVisible:
    id: topic-picker
- assertVisible:
    id: year-picker

# Verify default state — "of" separator is visible
- assertVisible: "of"

# Swipe topic picker (scroll to change topic)
- swipe:
    start: 50%, 37%
    end: 50%, 27%

# Swipe year picker (scroll to change year)
- swipe:
    start: 50%, 62%
    end: 50%, 52%

# Navigate to setup and verify the selected topic/year is reflected
- tapOn: "Start"
- waitForAnimationToEnd

# Verify we're on the topic screen (setup)
- assertVisible: "User name"
- assertVisible: "Random"
