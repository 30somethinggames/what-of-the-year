# Toolchain pins. Install mise (https://mise.jdx.dev), then `mise install`.

[tools]
# The project runtime and package manager. Keep in step with `engines.bun` in
# package.json and with the version CI installs (`.github/workflows/ci.yml`
# reads this file).
bun = "1.3.11"

# Playwright only. Its test runner (1.62) will not load our specs under the bun
# runtime — `bunx playwright test` with no node on PATH fails with
# "N errors building …/*.e2e.ts" — so `bun run test:web` needs a node here.
# Nothing else in the repo does. When Playwright runs under bun, delete this
# line; there is nothing else to unwind.
node = "24"

# Tasks are the entry point for everything a checkout does, so the same name
# means the same thing to a person, to CI, and to an agent. They call the
# package.json scripts rather than replacing them.

[tasks.checks]
description = "Format, lint, types, unit tests — what must pass before a commit"
run = "bun run check:format && bun run check:lint && bun run check:types && bun run test"

[tasks.dev]
description = "Vite dev server on :5173"
run = "bun run dev"

[tasks.e2e]
description = "Playwright against a Convex preview deployment this run creates"
run = "bun scripts/e2e.ts"

[tasks.gate]
description = "Everything CI runs on a PR: checks, then the e2e suite"
depends = ["checks"]
run = "mise run e2e"
