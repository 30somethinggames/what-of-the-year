# Toolchain pins. Install mise (https://mise.jdx.dev), then `mise install`.

[tools]
# The project runtime and package manager. Keep in step with `engines.bun` in
# package.json and with the version CI installs (`.github/workflows/ci.yml`
# reads this file).
bun = "1.4.2"

# Playwright only. Its test runner (1.62) will not load our specs under the bun
# runtime — `bunx playwright test` with no node on PATH fails with
# "N errors building …/*.e2e.ts" — so `bun run test:e2e` needs a node here.
# Nothing else in the repo does. When Playwright runs under bun, delete this
# line; there is nothing else to unwind.
node = "24"

# Tasks are the entry point for everything a person or CI runs. `mise tasks`
# lists them. package.json keeps only the scripts other tools invoke by name.
#
# Commands go through `bunx` so they resolve node_modules/.bin. Putting that on
# PATH with `[env]` would work too, but a mise.toml with an env block has to be
# trusted before it runs, and that is a setup step on every checkout.

[tasks.dev]
description = "Vite dev server"
run = "bunx vite"

[tasks.format]
description = "Check formatting"
run = "bunx oxfmt --check ."

[tasks."format:fix"]
description = "Format in place"
run = "bunx oxfmt ."

[tasks.lint]
description = "Lint"
run = "bunx oxlint ."

[tasks."lint:fix"]
description = "Lint and fix what can be fixed"
run = "bunx oxlint --fix ."

[tasks.types]
description = "Type-check"
run = "bunx tsc --noEmit"

[tasks.test]
description = "Unit tests, with the coverage floor"
run = "bun test --coverage"

[tasks."test:e2e"]
description = "Playwright against a Convex preview deployment this run creates"
run = "bun scripts/e2e.ts"

[tasks."test:e2e:smoke"]
description = "The three journey specs only, in both projects — the fast subset for the working loop"
run = "bun scripts/e2e.ts --grep @smoke"

[tasks.backend]
description = "A local Convex backend for this checkout, written into .env.local — what a worktree develops against"
# Three stock commands. CONVEX_AGENT_MODE picks an anonymous local deployment
# only while none is configured. A checkout whose .env.local already names a
# cloud deployment is refused first: a person's own loop is never replaced.
# A cloud deployment named in the environment is ignored instead: Ronco runs
# this in a worktree with the root checkout's .env.local exported, and the CLI
# would otherwise refuse the preview deploy key, or push to the dev deployment
# that CONVEX_DEPLOYMENT names. The unset covers every command below.
#
# The commands run under a lock every checkout on the machine shares. Each one
# starts this checkout's backend on a port the CLI checked was free, and stops
# it on exit — but the check comes seconds before the backend binds. Two
# checkouts inside that window pick the same port, and the loser fails with
# BadAdminKey against the winner's backend (#277). The lock is a mkdir, since
# macOS has no flock, in /tmp rather than $TMPDIR, which differs by process. One
# older than five minutes is a crashed run's, and is broken.
run = """
if grep -qsE '^CONVEX_DEPLOYMENT=.?(dev|prod|preview):' .env.local; then
  echo ".env.local already names a cloud deployment. Keep using it, or remove CONVEX_DEPLOYMENT and VITE_CONVEX_URL from it to get a local backend." >&2
  exit 1
fi
unset CONVEX_DEPLOY_KEY CONVEX_DEPLOYMENT CONVEX_SELF_HOSTED_URL CONVEX_SELF_HOSTED_ADMIN_KEY
export CONVEX_AGENT_MODE=anonymous
lock=/tmp/what-of-the-year-convex-backend.lock
until mkdir "$lock" 2>/dev/null; do
  if [ -n "$(find "$lock" -maxdepth 0 -mmin +5 2>/dev/null)" ]; then
    rmdir "$lock" 2>/dev/null
    continue
  fi
  sleep 1
done
trap 'rmdir "$lock" 2>/dev/null' EXIT
bunx convex dev --once --tail-logs disable
bunx @convex-dev/auth --skip-git-check --web-server-url http://localhost:5173 </dev/null
bunx convex env set OPTIONS_FIXTURES 1
rmdir "$lock"
trap - EXIT
echo "Local backend ready. Keep 'bunx convex dev' running and start 'mise run dev'."
"""

[tasks."backend:reset"]
description = "Throw the local backend away and bring it up clean"
run = """
if grep -qsE '^CONVEX_DEPLOYMENT=.?(dev|prod|preview):' .env.local; then
  echo ".env.local names a cloud deployment; nothing here is local to reset." >&2
  exit 1
fi
rm -rf .convex .env.local
mise run backend
"""

[tasks.check]
description = "Format, lint, types and unit tests — what must pass before a commit"
depends = ["format", "lint", "types", "test"]

[tasks.ci]
description = "Everything CI runs on a PR"
depends = ["check"]
run = "mise run test:e2e"
