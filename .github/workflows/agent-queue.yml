name: Agent Queue

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: agent-pipeline
  cancel-in-progress: false

jobs:
  next-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
      item: ${{ steps.pick.outputs.item }}
      started: ${{ steps.pick.outputs.started }}
    steps:
      - name: Pick oldest Ready ticket and move to In Progress
        id: pick
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          FIELDS=$(gh api graphql -f query='query{organization(login:"30somethinggames"){projectV2(number:3){id field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}}}')
          PROJECT_ID=$(echo "$FIELDS" | jq -r '.data.organization.projectV2.id')
          FIELD_ID=$(echo "$FIELDS" | jq -r '.data.organization.projectV2.field.id')
          IN_PROGRESS=$(echo "$FIELDS" | jq -r '.data.organization.projectV2.field.options[] | select(.name=="In Progress") | .id')

          ITEMS=$(gh api graphql -f query='query{organization(login:"30somethinggames"){projectV2(number:3){items(first:100){nodes{id createdAt fieldValueByName(name:"Status"){... on ProjectV2ItemFieldSingleSelectValue{name}} content{... on Issue{number state}}}}}}}')
          CANDIDATES=$(echo "$ITEMS" | jq -r '[.data.organization.projectV2.items.nodes[] | select(.fieldValueByName.name=="Ready") | select(.content.state=="OPEN")] | sort_by(.createdAt) | .[] | "\(.content.number) \(.id)"')

          ISSUE=""; ITEM=""
          while read -r num id; do
            [ -z "$num" ] && continue
            OPEN_BLOCKERS=$(gh api "repos/${{ github.repository }}/issues/$num/dependencies/blocked_by" --jq '[.[] | select(.state=="open")] | length' 2>/dev/null || echo 0)
            if [ "$OPEN_BLOCKERS" -gt 0 ]; then
              echo "Skipping #$num — $OPEN_BLOCKERS open blocker(s)."
              continue
            fi
            ISSUE="$num"; ITEM="$id"; break
          done <<< "$CANDIDATES"

          if [ -z "$ISSUE" ]; then
            echo "Queue empty — nothing unblocked in Ready."
            echo "Queue empty — nothing unblocked in Ready." >> "$GITHUB_STEP_SUMMARY"
            echo "issue=" >> "$GITHUB_OUTPUT"
            echo "item=" >> "$GITHUB_OUTPUT"
            echo "started=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api graphql -f query='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}' \
            -f p="$PROJECT_ID" -f i="$ITEM" -f f="$FIELD_ID" -f o="$IN_PROGRESS" >/dev/null
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Picked #$ISSUE"
          echo "Picked #$ISSUE — moved to In Progress." >> "$GITHUB_STEP_SUMMARY"
          GH_TOKEN="${{ github.token }}" gh issue comment "$ISSUE" -R "${{ github.repository }}" \
            --body "🤖 Picked up by the agent queue — [run]($RUN_URL)."
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "item=$ITEM" >> "$GITHUB_OUTPUT"
          echo "started=$STARTED" >> "$GITHUB_OUTPUT"

  implement:
    needs: next-ticket
    if: needs.next-ticket.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    outputs:
      stats: ${{ steps.stats.outputs.stats }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/implement-ticket ${{ needs.next-ticket.outputs.issue }}"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80

      # Turns / wall-clock / cost for the run — step summary now, issue comment
      # via board-update, so per-ticket cost is queryable later.
      - name: Run stats
        id: stats
        if: always()
        run: |
          F="${{ steps.claude.outputs.execution_file }}"
          if [ -n "$F" ] && [ -f "$F" ]; then
            STATS=$(jq -r '[.[] | select(.type == "result")] | last
              | "\(.num_turns) turns · \((.duration_ms / 60000) | round)m · $\((.total_cost_usd * 100 | round) / 100)"' "$F" 2>/dev/null || echo "stats unavailable")
          else
            STATS="stats unavailable"
          fi
          echo "Implement: $STATS" >> "$GITHUB_STEP_SUMMARY"
          echo "stats=$STATS" >> "$GITHUB_OUTPUT"

  board-update:
    needs: [next-ticket, implement]
    if: always() && needs.next-ticket.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Move to Ready for Review (PR up) or Blocked (no PR)
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          GH_REPO_TOKEN: ${{ github.token }}
        run: |
          ISSUE="${{ needs.next-ticket.outputs.issue }}"
          ITEM="${{ needs.next-ticket.outputs.item }}"
          STARTED="${{ needs.next-ticket.outputs.started }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          HAS_PR=$(GH_TOKEN="$GH_REPO_TOKEN" gh pr list -R "${{ github.repository }}" --state open --json headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"agent/$ISSUE-\"))] | length")
          STATS="${{ needs.implement.outputs.stats }}"
          NOTE=""
          if [ "$HAS_PR" -gt 0 ]; then
            TARGET="Ready for Review"
          else
            TARGET="Blocked"
            # Blocked protocol says the agent comments before exiting. No agent
            # comment since pick time means it died (timeout, turn cap, error)
            # rather than blocked deliberately — say so, so Ryan restarts
            # instead of looking for a decision to make.
            EXPLAINED=$(GH_TOKEN="$GH_REPO_TOKEN" gh api "repos/${{ github.repository }}/issues/$ISSUE/comments?per_page=100" \
              --jq "[.[] | select((.user.login | startswith(\"claude\")) and .created_at > \"$STARTED\")] | length")
            if [ "$EXPLAINED" -eq 0 ]; then
              NOTE=" ⚠️ The agent exited without a PR or an explanation (implement job: \`${{ needs.implement.result }}\`). Move back to Ready to retry."
            fi
          fi
          GH_TOKEN="$GH_REPO_TOKEN" gh issue comment "$ISSUE" -R "${{ github.repository }}" \
            --body "🏁 Agent run finished → **$TARGET** · $STATS · [run]($RUN_URL).$NOTE"
          echo "#$ISSUE → $TARGET"
          echo "#$ISSUE → $TARGET (implement job: ${{ needs.implement.result }}, $STATS)" >> "$GITHUB_STEP_SUMMARY"
          FIELDS=$(gh api graphql -f query='query{organization(login:"30somethinggames"){projectV2(number:3){id field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}}}')
          PROJECT_ID=$(echo "$FIELDS" | jq -r '.data.organization.projectV2.id')
          FIELD_ID=$(echo "$FIELDS" | jq -r '.data.organization.projectV2.field.id')
          OID=$(echo "$FIELDS" | jq -r --arg t "$TARGET" '.data.organization.projectV2.field.options[] | select(.name==$t) | .id')
          gh api graphql -f query='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}' \
            -f p="$PROJECT_ID" -f i="$ITEM" -f f="$FIELD_ID" -f o="$OID" >/dev/null
