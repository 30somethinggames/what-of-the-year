name: CI

on:
  pull_request:
    branches:
      - main
  # Post-merge safety net. The ruleset requires branches to be up to date
  # before merge, so this only catches admin bypass pushes and flakes.
  push:
    branches:
      - main
  # Merge queue: required checks run on the queue's temp branch before merge.
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only PRs supersede themselves; a post-merge run on main must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # Runs in ~2 min; anything near this is hung, not slow.
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One pin, one source: the version comes from mise.toml, the same file a
      # laptop installs from. mise itself is not used here — this repo allows
      # github-owned actions plus three vendors, and widening that list for a
      # convenience action buys nothing these two steps do not.
      - name: Read the pinned bun version
        id: bun-version
        run: sed -n 's/^bun = "\(.*\)"$/bun=\1/p' mise.toml >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun-version.outputs.bun }}

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run check:format

      - name: Check linting
        run: bun run check:lint

      - name: Check types
        run: bun run check:types

      - name: Run unit tests
        run: bun run test

  # `needs: checks` is deliberate: a red lint/type/unit run means another push
  # is coming anyway, so an e2e run against that commit is wasted minutes. The
  # serial cost is accepted; do not parallelise these.
  e2e:
    needs: checks
    runs-on: ubuntu-latest
    # Preview deploy, build and the suite land around 5 min; 15 leaves room for a
    # slow runner without waiting out the 6-hour default on a wedged step.
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      # A preview deploy key: it can create preview deployments and set env vars
      # on them, and nothing else. It cannot touch prod or anyone's dev
      # deployment, which is why this job is allowed a secret at all.
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # As in `checks`. No node step: mise.toml pins one because Playwright's
      # runner needs it on a laptop, and ubuntu-latest already ships one.
      - name: Read the pinned bun version
        id: bun-version
        run: sed -n 's/^bun = "\(.*\)"$/bun=\1/p' mise.toml >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun-version.outputs.bun }}

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      # No `playwright install-deps`: every library chromium links against is
      # already in the ubuntu-latest image (the step only ever added CJK/Cyrillic
      # fonts nothing here renders) and it cost ~12s of apt every run. If a future
      # image drops one, Playwright fails to launch with an explicit "Host system
      # is missing dependencies" error naming this command as the fix.

      # The same script `mise run e2e` runs. It creates this run's preview
      # deployment, mints the test secret and auth keypair, builds against the
      # new URL and runs Playwright. CI's only difference is the preview's name.
      # Called directly rather than through mise: the runner has no mise, and
      # the repo's allowed-actions list does not include one.
      - name: Run e2e
        env:
          PREVIEW_NAME: >-
            ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
             || github.event_name == 'merge_group' && format('mg-{0}', github.event.merge_group.head_sha)
             || 'main' }}
          PLAYWRIGHT_FORCE_TTY: "120"
          FORCE_COLOR: "1"
        run: bun scripts/e2e.ts

      # Failed and flaky specs on the check's Details page, so nobody has to
      # download the report to learn which test broke.
      - name: Summarize e2e results
        if: ${{ !cancelled() }}
        run: |
          F=test-results/results.json
          if [ ! -f "$F" ]; then
            echo "## e2e — no results file (run aborted before Playwright wrote one)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '
            def strip: gsub("\u001b\\[[0-9;]*m"; "");
            def specs(status): [.. | objects | select(has("specs")) | .specs[]
              | select(any(.tests[]; .status == status))];
            def firstError: [.tests[0].results[] | .error.message // empty] | first // "";
            def render: .[] | "- **\(.title)** — `\(.file):\(.line)`"
              + (firstError | strip | split("\n")[0]
                 | if . == "" then "" else "\n  `" + . + "`" end);
            (specs("unexpected") | if length > 0 then "## e2e failed (\(length))\n" + ([render] | join("\n")) + "\n" else empty end),
            (specs("flaky") | if length > 0 then "## e2e flaky — passed on retry (\(length))\n" + ([render] | join("\n")) + "\n" else empty end),
            (if (specs("unexpected") | length) == 0 and (specs("flaky") | length) == 0 then "## e2e — all passed, no retries" else empty end)
          ' "$F" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
