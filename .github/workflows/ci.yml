name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run check:format

      - name: Check linting
        run: bun run check:lint

      - name: Check types
        run: bun run check:types

      - name: Run unit tests
        run: bun test

  e2e:
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Deploy Convex preview and build
        run: |
          bunx convex deploy \
            --preview-create "pr-${{ github.event.pull_request.number }}" \
            --cmd 'echo "$VITE_CONVEX_SITE_URL" > /tmp/convex-site-url.txt && bun run build' \
            --cmd-url-env-var-name VITE_CONVEX_URL

      - name: Set TEST_SECRET on preview
        run: |
          bunx convex env set TEST_SECRET "${{ secrets.TEST_SECRET }}" \
            --preview-name "pr-${{ github.event.pull_request.number }}"

      - name: Run Playwright tests
        run: |
          CONVEX_SITE_URL=$(cat /tmp/convex-site-url.txt) \
          TEST_SECRET="${{ secrets.TEST_SECRET }}" \
          bunx playwright test

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
